name: TUI package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the TUI archive to a GitHub release
        required: true
        default: false
        type: boolean
  push:
    paths:
      - "apps/tui/**"
      - ".github/workflows/tui.yml"

permissions:
  contents: write

jobs:
  detect-version:
    name: Detect TUI package version change
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
      version: ${{ steps.detect.outputs.version }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Detect version bump
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./apps/tui/package.json').version")"
          tag_name="tui-v${current_version}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            should_run=true
            previous_version="manual"
            tui_changed=true
            version_changed=true
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi

            tui_changed=false
            if git diff --name-only "$base" "$GITHUB_SHA" -- apps/tui .github/workflows/tui.yml | grep -q .; then
              tui_changed=true
            fi

            previous_version=""
            if git cat-file -e "$base:apps/tui/package.json" 2>/dev/null; then
              previous_version="$(
                git show "$base:apps/tui/package.json" |
                  node -e "let data = ''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => console.log(JSON.parse(data).version));"
              )"
            fi

            version_changed=false
            if [[ "$previous_version" != "$current_version" ]]; then
              version_changed=true
            fi

            should_run=false
            if [[ "$tui_changed" == true && "$version_changed" == true ]]; then
              should_run=true
            fi
          fi

          {
            echo "TUI changed: $tui_changed"
            echo "Previous version: $previous_version"
            echo "Current version: $current_version"
            echo "Version changed: $version_changed"
            echo "Should run package workflow: $should_run"
            echo "Release tag: $tag_name"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate TUI package
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3
        with:
          ocaml-compiler: 5.2
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . ./apps/tui --deps-only --with-test --yes

      - name: Generate opam metadata
        working-directory: apps/tui
        run: |
          opam exec -- dune build @opam
          git diff --exit-code symphony-orchestrator-tui.opam

      - name: Lint opam metadata
        working-directory: apps/tui
        run: opam lint symphony-orchestrator-tui.opam

      - name: Build TUI package
        working-directory: apps/tui
        run: opam exec -- dune build @all

      - name: Test TUI package
        working-directory: apps/tui
        run: opam exec -- dune runtest

      - name: Build product workspace
        run: opam exec -- dune build @all

      - name: Build release archive
        working-directory: apps/tui
        run: sh scripts/release-archive.sh "${{ needs.detect-version.outputs.version }}" HEAD

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symphony-orchestrator-tui-${{ needs.detect-version.outputs.version }}
          path: apps/tui/dist/symphony-orchestrator-tui-${{ needs.detect-version.outputs.version }}.tar.gz
          if-no-files-found: error

      - name: Publish TUI GitHub release
        if: (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.detect-version.outputs.tag_name }}
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail

          archive="apps/tui/dist/symphony-orchestrator-tui-${VERSION}.tar.gz"
          title="Symphony TUI ${VERSION}"
          notes="Release archive for the symphony-orchestrator-tui opam package."

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$archive" --clobber
          else
            gh release create "$TAG_NAME" "$archive" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
