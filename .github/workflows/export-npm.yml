name: Export npm package

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the assembled package to npm using NPM_TOKEN
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binary:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ocaml-compiler: 5.2
          - os: macos-15-intel
            platform: darwin
            arch: x64
            ocaml-compiler: 5.2
          - os: macos-14
            platform: darwin
            arch: arm64
            ocaml-compiler: 5.2
          - os: windows-latest
            platform: win32
            arch: x64
            ocaml-compiler: 5.2

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install OCaml dependencies
        shell: bash
        run: opam install . --deps-only --with-test --yes

      - name: Build backend
        shell: bash
        run: opam exec -- dune build @all

      - name: Package platform binary
        shell: bash
        env:
          SYMPHONY_PACKAGE_PLATFORM: ${{ matrix.platform }}
          SYMPHONY_PACKAGE_ARCH: ${{ matrix.arch }}
        run: node scripts/package-binary.js

      - name: Upload vendor binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vendor-${{ matrix.platform }}-${{ matrix.arch }}
          path: vendor/symphony-${{ matrix.platform }}-${{ matrix.arch }}*
          if-no-files-found: error

  assemble-package:
    name: Assemble npm package
    runs-on: ubuntu-latest
    needs: build-binary

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vendor-*
          path: vendor
          merge-multiple: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3
        with:
          ocaml-compiler: 5.2
          dune-cache: true

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          opam install . --deps-only --with-test --yes

      - name: Validate release package
        shell: bash
        run: pnpm npm:validate:release -- --keep-tarball

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mv symphony-orchestrator-*.tgz dist/
          cp vendor/symphony-* dist/

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symphony-orchestrator-npm-export
          path: dist/*
          if-no-files-found: error

      - name: Publish to npm
        if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist/symphony-orchestrator-*.tgz --access public

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PACKAGE_URL: https://www.npmjs.com/package/symphony-orchestrator
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            CREATE_ARGS=("--verify-tag")
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG_NAME="v${VERSION}"
            CREATE_ARGS=("--target" "${GITHUB_SHA}")
          fi

          PACKAGE_LINK="- npm package: [symphony-orchestrator](${NPM_PACKAGE_URL})"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
            CURRENT_BODY="$(gh release view "$TAG_NAME" --json body --jq .body)"

            if ! grep -Fq "$NPM_PACKAGE_URL" <<<"$CURRENT_BODY"; then
              RELEASE_NOTES="$(mktemp)"
              printf "%s\n\n%s\n" "$PACKAGE_LINK" "$CURRENT_BODY" > "$RELEASE_NOTES"
              gh release edit "$TAG_NAME" --notes-file "$RELEASE_NOTES"
            fi
          else
            gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --notes "$PACKAGE_LINK" --generate-notes "${CREATE_ARGS[@]}"
          fi
